[project]
name = "GirderBIDS"
version = "0.1.0"
description = "Girder BIDS project containing a Girder Plugin to handle BIDS and a CLI BIDS importer"
authors = []
dependencies = [
    "girder>=5.0.0",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-girder>=5.0.0",
]
cli = [
    "girder-client>=5.0.0",
    "fire",
    "bids-validator-deno==2.4.1; sys_platform == 'linux'",
]

[project.entry-points."girder.plugin"]
bids_plugin = "bids_plugin:BIDSPlugin"

[project.scripts]
bids-importer = "cli.bids_importer:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["bids_plugin", "cli"]

[tool.ruff]

[tool.ruff.lint]
extend-select = [
    "ANN", # flake8-type-hint
    "ARG", # flake8-unused-arguments
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "EM", # flake8-errmsg
    "EXE", # flake8-executable
    "G", # flake8-logging-format
    "I", # isort
    "ICN", # flake8-import-conventions
    "NPY", # NumPy specific rules
    "PD", # pandas-vet
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL", # pylint
    "PT", # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP", # pyupgrade
    "YTT", # flake8-2020
]
ignore = [
    "EM101",
    "EM102",
    "G004", # f-string in logging statement
    "PLR09", # Too many <...>
    "PLR2004", # Magic value used in comparison
    "ISC001", # Conflicts with formatter
    "ANN401", # Any
    "ANN002", # *args
    "ANN003", # **kwargs
]
isort.required-imports = []

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["ARG001"]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = [
    "__init__.py:__version__",
]

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.semantic_release.branches.main]
match = "(main|master)"

[tool.coverage.report]
omit = ["*/tests/*"]
exclude_lines = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
